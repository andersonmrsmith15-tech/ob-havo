<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open-Meteo: joriy ob-havo — Ob-havo.uz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #10264a; --bg2: #1f4c80;
      --glass: rgba(10, 22, 45, 0.42); --border: rgba(255, 255, 255, 0.16);
      --text: #fff; --text-2: rgba(255, 255, 255, 0.82); --muted: rgba(255, 255, 255, 0.66);
      --accent: #ffd166; --rain: #8fd0ff;
      font-family: 'Manrope', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 85% 0%, #3d6fb0 0%, transparent 55%), linear-gradient(165deg, var(--bg1), var(--bg2)); }
    button, select { font: inherit; color: inherit; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 18px 14px 32px; }

    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .brand { display: flex; flex-direction: column; }
    .brand h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
    .brand span { color: var(--muted); font-size: 0.82rem; }
    .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    select, .btn {
      padding: 9px 13px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.1);
      cursor: pointer; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 7px;
    }
    select option { color: #0f172a; }
    .btn:hover, select:hover { background: rgba(255, 255, 255, 0.18); }
    .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn.loading svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .banner { border-radius: 14px; padding: 11px 14px; margin-bottom: 14px; font-size: 0.9rem; line-height: 1.45; }
    .banner.demo { background: rgba(255, 209, 102, 0.16); border: 1px solid rgba(255, 209, 102, 0.5); }
    .banner.err { background: rgba(248, 113, 113, 0.16); border: 1px solid rgba(248, 113, 113, 0.5); }
    .banner code { background: rgba(0, 0, 0, 0.25); padding: 1px 6px; border-radius: 6px; }

    .card { background: var(--glass); border: 1px solid var(--border); border-radius: 22px; padding: 20px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(2, 6, 23, .25); }
    .card h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 600; }
    .grid { display: grid; gap: 14px; }

    .now { display: grid; gap: 18px; grid-template-columns: 1fr; }
    .now-main { display: flex; align-items: center; gap: 16px; }
    .now-emoji { font-size: 84px; line-height: 1; }
    .now-temp { font-size: clamp(72px, 14vw, 104px); font-weight: 200; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .now-desc { font-size: 1.15rem; font-weight: 500; margin-top: 6px; }
    .now-sub { color: var(--text-2); font-size: 0.92rem; margin-top: 2px; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat { background: rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 11px 13px; }
    .stat span { display: block; color: var(--muted); font-size: 0.78rem; }
    .stat strong { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
    .stat small { color: var(--text-2); font-weight: 400; font-size: 0.8rem; }
    .arrow { width: 14px; height: 14px; display: inline-block; transition: transform .6s ease; }

    .strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
    .step { flex: 0 0 96px; scroll-snap-align: start; text-align: center; background: rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
    .step .tm { color: var(--muted); font-size: 0.8rem; }
    .step .em { font-size: 32px; line-height: 1.1; }
    .step .tp { font-weight: 600; font-size: 1.05rem; }
    .step .pr { color: var(--rain); font-size: 0.75rem; min-height: 1em; }
    .step .wd { color: var(--muted); font-size: 0.75rem; }

    .days { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .day { display: grid; grid-template-columns: 92px 36px 1fr 40px 110px 40px; align-items: center; gap: 10px; padding: 9px 6px; border-radius: 12px; }
    .day:hover { background: rgba(255, 255, 255, 0.06); }
    .day .dn { font-weight: 600; }
    .day .dn small { display: block; color: var(--muted); font-weight: 400; font-size: 0.75rem; }
    .day .em { font-size: 26px; }
    .day .ds { color: var(--text-2); font-size: 0.85rem; }
    .day .ds .pr { color: var(--rain); }
    .day .mn { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .day .mx { font-weight: 600; font-variant-numeric: tabular-nums; }
    .range { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.16); position: relative; }
    .range span { position: absolute; top: 0; bottom: 0; border-radius: 6px; }

    footer { margin-top: 18px; color: var(--muted); font-size: 0.85rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.16) 50%, rgba(255,255,255,.06) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 14px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @media (min-width: 760px) {
      .now { grid-template-columns: 1.1fr 1fr; align-items: center; }
      .stats { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 620px) {
      .day { grid-template-columns: 70px 30px 34px 1fr 34px; }
      .day .ds { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Joriy ob-havo</h1>
        <span>Open-Meteo API · current_weather</span>
      </div>
      <div class="actions">
        <label for="city" class="sr-only">Shahar</label>
        <select id="city"></select>
        <button type="button" class="btn" id="refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>Yangilash
        </button>
        <button type="button" class="btn" id="close" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Oynani yopish
        </button>
      </div>
    </header>

    <div id="banner" role="status"></div>

    <main class="grid" id="main" aria-busy="true">
      <section class="card now" aria-labelledby="h-now">
        <h2 id="h-now" class="sr-only">Hozirgi ob-havo</h2>
        <div id="now-main"><div class="skeleton" style="height:150px"></div></div>
        <div class="stats" id="stats"><div class="skeleton" style="height:150px;grid-column:1/-1"></div></div>
      </section>

      <section class="card" aria-labelledby="h-steps">
        <h2 id="h-steps">Soatlik prognoz</h2>
        <div class="strip" id="steps" tabindex="0" role="list" aria-label="Soatlik prognoz, keyingi 24 soat"><div class="skeleton" style="height:150px;flex:1"></div></div>
      </section>

      <section class="card" aria-labelledby="h-days">
        <h2 id="h-days">7 kunlik prognoz</h2>
        <ul class="days" id="days"><li class="skeleton" style="height:200px"></li></ul>
      </section>
    </main>

    <footer>
      <span>Ma'lumot manbai: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · <span id="meta"></span></span>
      <a href="/" id="home">← Ob-havo.uz bosh sahifa</a>
    </footer>
  </div>
  <script src="/open-meteo-page.js"></script>
</body>
</html>
